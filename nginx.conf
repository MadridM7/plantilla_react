server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad, aplicadas a toda respuesta de este servidor.
    # Si cambias algo acá, cambia también server.js (el servidor que se usa
    # para "npm run preview" sin Docker) — mismo contrato, dos implementaciones.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' en style-src es necesario porque React aplica el prop
    # `style` como estilos inline; si migras a una librería CSS-in-JS o CSS
    # Modules puro, puedes quitarlo.
    # connect-src incluye el origen de plantilla-node (VITE_API_BASE_URL):
    # sin esto, CSP bloquea el fetch/axios ANTES de que exista un problema
    # de CORS — el navegador nunca intenta la conexión, y el error que se ve
    # (network error genérico) no dice "CSP" en ningún lado obvio, solo
    # queda en la consola. Si cambias VITE_API_BASE_URL, actualiza esto.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3010; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Solo tiene efecto si el sitio se sirve por HTTPS (el navegador ignora
    # esta cabecera sobre HTTP); se deja lista para cuando haya TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Los archivos bajo /assets/ los genera Vite con hash en el nombre
    # (ej. index-DsDWJa2V.js): si cambia el contenido, cambia el nombre, así
    # que es seguro cachearlos "para siempre" en el navegador/CDN. Reduce
    # peticiones repetidas y mejora directamente el LCP/TTFB percibido.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html sí puede cambiar entre despliegues sin cambiar de URL:
    # nunca debe cachearse, o el usuario quedaría atado a un bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
